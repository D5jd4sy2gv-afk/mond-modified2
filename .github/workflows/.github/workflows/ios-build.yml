
name: Build Mond IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mond/**'
      - 'mond.xcodeproj/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --keepParent Payload mond.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mond-unsigned-ipa
          path: mond.ipa
          retention-days: 14
