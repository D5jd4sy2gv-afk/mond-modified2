
name: Build Mond IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          set -o pipefail
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --keepParent Payload mond.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mond-unsigned-ipa
          path: mond.ipa
