
name: Import Mond ZIP

on:
  push:
    paths:
      - 'mond-main-iphone11-14-build-ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/mond-src
          unzip -q mond-main-iphone11-14-build-ready.zip -d /tmp/mond-src
          rsync -a --exclude='.github/' /tmp/mond-src/mond-main/ ./
          rm mond-main-iphone11-14-build-ready.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import modified Mond source"
          git push
